<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录/注册 - <{$web_name}></title>
<link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.9.17/css/layui.css">
<style>
  body{background:#f2f3f5;}
  .auth-box{max-width:400px;margin:6% auto;background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:30px;}
  .auth-title{text-align:center;font-size:20px;font-weight:600;margin-bottom:5px;}
  .auth-tabs{text-align:center;margin-bottom:20px;}
  .auth-tabs span{padding:6px 20px;cursor:pointer;color:#666;}
  .auth-tabs span.active{color:#1e9fff;border-bottom:2px solid #1e9fff;}
</style>
</head>
<body>
<div class="auth-box">
  <div class="auth-title"><{$web_name}></div>
  <div class="auth-tabs">
    <span id="tabLogin" class="active">登录</span>
    <span id="tabReg">注册</span>
  </div>

  <!-- 登录表单 -->
  <form id="loginForm">
    <div class="layui-form-item"><input class="layui-input" name="email" placeholder="邮箱"></div>
    <div class="layui-form-item"><input type="password" class="layui-input" name="pwd" placeholder="密码"></div>
    <div class="layui-form-item"><button class="layui-btn layui-btn-fluid" id="loginBtn">登 录</button></div>
  </form>

  <!-- 注册表单 -->
  <form id="regForm" style="display:none;">
    <div class="layui-form-item"><input class="layui-input" name="email" placeholder="注册邮箱"></div>
    <div class="layui-form-item"><input type="password" class="layui-input" name="pwd" placeholder="密码（8-16位，不含中文空格）"></div>
    <div class="layui-form-item"><input type="password" class="layui-input" name="pwd2" placeholder="确认密码"></div>
    <div class="layui-form-item"><input class="layui-input" name="code" placeholder="卡密"></div>
    <div class="layui-form-item"><button class="layui-btn layui-btn-fluid" id="regBtn">注 册</button></div>
  </form>
</div>

<!-- 其他设备登录提示弹窗（默认隐藏，show=1 时显示） -->
<script src="https://cdn.staticfile.org/layui/2.9.17/layui.js"></script>
<script>
layui.use(['layer'], function(){
  var $ = layui.$, layer = layui.layer;
  // 切换登录/注册
  $('#tabLogin').on('click', function(){
    $(this).addClass('active'); $('#tabReg').removeClass('active');
    $('#loginForm').show(); $('#regForm').hide();
  });
  $('#tabReg').on('click', function(){
    $(this).addClass('active'); $('#tabLogin').removeClass('active');
    $('#regForm').show(); $('#loginForm').hide();
  });
  // 登录
  $('#loginBtn').on('click', function(e){
    e.preventDefault();
    var load = layer.load(2);
    $.post('<{:U("Home/Login/doLogin")}>', $('#loginForm').serialize(), function(res){
      layer.close(load);
      if(res.code===0){ layer.msg(res.msg,{icon:1,time:800},function(){ location.href=res.url; }); }
      else layer.msg(res.msg,{icon:2});
    },'json');
  });
  // 注册
  $('#regBtn').on('click', function(e){
    e.preventDefault();
    var load = layer.load(2);
    $.post('<{:U("Home/Login/doRegister")}>', $('#regForm').serialize(), function(res){
      layer.close(load);
      if(res.code===0){ layer.msg(res.msg,{icon:1,time:800},function(){ location.href=res.url; }); }
      else layer.msg(res.msg,{icon:2});
    },'json');
  });
  // show=1 时弹出"其他设备登录"提示
  if(<{$show|default=0}> === 1){
    layer.alert('您的账号已在其他设备登录，如非本人操作请尽快修改密码。', {icon:7, title:'安全提示'});
  }
});
</script>
</body>
</html>
