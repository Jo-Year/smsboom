<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><{$web_name}> - 后台管理</title>
<script src="https://cdn.staticfile.org/layui/2.9.17/layui.js"></script>
<link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.9.17/css/layui.css">
<style>
  body{margin:0;}
  .layui-layout-admin .layui-logo{color:#fff;font-size:16px;font-weight:600;}
  .layui-nav-img{width:30px;height:30px;border-radius:50%;}
  .admin-user{padding:0 20px;color:#fff;}
  .admin-user a{color:#fff;}
  .layui-body{bottom:0;}
  .page-box{padding:20px;}
  .search-bar{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;align-items:center;}
  .search-bar .layui-input{width:auto;}
  .site-mask{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:999;}
  @media screen and (max-width:768px){
    .layui-side{left:-260px;transition:all .3s;z-index:1001;box-shadow:2px 0 8px rgba(0,0,0,.3);}
    .layui-side.nav-open{left:0;}
    .layui-body{left:0 !important;}
    .page-box{padding:10px;overflow-x:auto;}
    .search-bar .layui-input{width:100%!important;}
    .site-mask.show{display:block;}
    .layui-header .layui-nav.layui-layout-left{position:absolute;left:10px;top:0;float:none;}
    .layui-header .layui-layout-right{padding-right:10px;}
  }
  /* 桌面端：汉堡按钮折叠/展开侧边栏 */
  @media screen and (min-width:769px){
    .layui-side{transition:all .3s ease;}
    body.side-mini .layui-side{left:-260px;}
    body.side-mini .layui-body{left:0 !important;}
  }
</style>
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">
  <!-- 顶部栏 -->
  <div class="layui-header">
    <div class="layui-logo layui-hide-xs"><{$web_name}> 后台</div>
    <ul class="layui-nav layui-layout-left">
      <li class="layui-nav-item"><a href="javascript:;" id="menuToggle"><i class="layui-icon layui-icon-shrink-right"></i></a></li>
    </ul>
    <ul class="layui-nav layui-layout-right">
      <li class="layui-nav-item">
        <a href="javascript:;"><i class="layui-icon layui-icon-username"></i> <{$admin_name}></a>
        <dl class="layui-nav-child">
          <dd><a href="<{:U('Admin/Login/logout')}>">退出登录</a></dd>
        </dl>
      </li>
    </ul>
  </div>

  <!-- 左侧菜单 -->
  <div class="layui-side layui-bg-black">
    <div class="layui-side-scroll">
      <ul class="layui-nav layui-nav-tree" lay-filter="adminMenu">
        <li class="layui-nav-item <{:CONTROLLER_NAME=='Index'?'layui-this':''}>">
          <a href="<{:U('Admin/Index/index')}>"><i class="layui-icon layui-icon-set"></i> 系统信息</a>
        </li>
        <li class="layui-nav-item <{:CONTROLLER_NAME=='User'?'layui-this':''}>">
          <a href="<{:U('Admin/User/index')}>"><i class="layui-icon layui-icon-user"></i> 用户列表</a>
        </li>
        <li class="layui-nav-item <{:CONTROLLER_NAME=='Code'?'layui-nav-itemed':''}>">
          <a href="javascript:;"><i class="layui-icon layui-icon-password"></i> 卡密管理</a>
          <dl class="layui-nav-child">
            <dd class="<{:ACTION_NAME=='add'?'layui-this':''}>"><a href="<{:U('Admin/Code/add')}>">添加卡密</a></dd>
            <dd class="<{:ACTION_NAME=='lst'?'layui-this':''}>"><a href="<{:U('Admin/Code/lst')}>">卡密列表</a></dd>
          </dl>
        </li>
        <li class="layui-nav-item <{:CONTROLLER_NAME=='Login' && ACTION_NAME=='log'?'layui-this':''}>">
          <a href="<{:U('Admin/Login/log')}>"><i class="layui-icon layui-icon-log"></i> 登录记录</a>
        </li>
      </ul>
    </div>
  </div>

  <!-- 右侧主内容 -->
  <div class="layui-body">
    <div class="page-box">
