<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台登录 - <{$web_name}></title>
<link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.9.17/css/layui.css">
<style>
  body{background:#f2f3f5;}
  .login-box{max-width:380px;margin:8% auto;background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:30px;}
  .login-title{text-align:center;font-size:20px;font-weight:600;margin-bottom:20px;color:#333;}
  .verify-box{display:flex;gap:10px;}
  .verify-box img{cursor:pointer;height:38px;border:1px solid #e6e6e6;border-radius:2px;}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-title"><{$web_name}> · 后台登录</div>
  <form class="layui-form" id="loginForm">
    <div class="layui-form-item">
      <input class="layui-input" name="admin_name" placeholder="管理员账号" autocomplete="off">
    </div>
    <div class="layui-form-item">
      <input type="password" class="layui-input" name="admin_pwd" placeholder="管理员密码">
    </div>
    <div class="layui-form-item verify-box">
      <input class="layui-input" name="verify" id="verifyInput" placeholder="验证码" autocomplete="off">
      <img id="verifyImg" src="<{:U('Admin/Login/verify')}>" title="点击刷新">
    </div>
    <div class="layui-form-item">
      <button class="layui-btn layui-btn-fluid" id="loginBtn">登 录</button>
    </div>
  </form>
</div>
<script src="https://cdn.staticfile.org/layui/2.9.17/layui.js"></script>
<script>
layui.use(['layer','form'], function(){
  var $ = layui.$, layer = layui.layer;
  // 刷新验证码：换图 + 清空输入框 + 聚焦
  function refreshVerify(){
    $('#verifyImg').attr('src', '<{:U("Admin/Login/verify")}>');
    $('#verifyInput').val('').focus();
  }
  // 点击图片手动刷新
  $('#verifyImg').on('click', refreshVerify);
  $('#loginBtn').on('click', function(e){
    e.preventDefault();
    var load = layer.load(2);
    $.post('<{:U("Admin/Login/doLogin")}>', $('#loginForm').serialize(), function(res){
      layer.close(load);
      if(res.code === 0){
        layer.msg(res.msg, {icon:1, time:800}, function(){ location.href = res.url; });
      } else {
        layer.msg(res.msg, {icon:2});
        refreshVerify(); // 失败后强制换验证码并清空旧输入
      }
    }, 'json');
  });
});
</script>
</body>
</html>
